<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3b126b"/>
      <stop offset="60%" stop-color="#1e0b36"/>
      <stop offset="100%" stop-color="#0f041d"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="35%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#D97706" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background shape (Squircle with safe zone) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Filigree Gold Border -->
  <rect x="28" y="28" width="456" height="456" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.85"/>
  <rect x="42" y="42" width="428" height="428" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Center Decorative Crest -->
  <circle cx="256" cy="256" r="160" fill="#17062c" stroke="url(#goldGrad)" stroke-width="5" filter="url(#goldGlow)"/>

  <!-- Monogram Letters CG (El Capataz Granadino) -->
  <text x="256" y="292" font-family="'Cinzel', 'Times New Roman', Georgia, serif" font-size="140" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">CG</text>
  
  <!-- Subtitle Ribbon -->
  <text x="256" y="348" font-family="'Inter', Arial, sans-serif" font-size="22" font-weight="700" fill="#FDE68A" text-anchor="middle" letter-spacing="8" opacity="0.9">GRANADA</text>
  
  <!-- Small top cross / star motif -->
  <path d="M 256 122 L 256 146 M 244 134 L 268 134" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
</svg>
